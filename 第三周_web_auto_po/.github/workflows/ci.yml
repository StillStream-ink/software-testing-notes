name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # 每天北京时间早上 9 点自动运行
    - cron: '0 1 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./第三周_web_auto_po   # 避免每个 step 都 cd

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # 稳定版本，playwright 兼容性好

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run tests
        run: |
          python -m pytest tests/test_saucedemo_po.py -n 2 -v --alluredir=./allure-results --clean-alluredir
          cp config/categories.json allure-results/categories.json

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: 第三周_web_auto_po/allure-results

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: 第三周_web_auto_po/allure-results
          allure_history: allure-history

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history